name: MangaAll generic signed-provider live source journeys

# One-shot opt-in only; no scheduled polling, PR fanout, cookies,
# image downloads, browser challenge bypass or signed publication.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Preset or custom list of arbitrary real works (custom input below)'
        required: true
        type: choice
        default: core
        options:
          - custom
          - core
          - cross-format
          - identity
          - manga
          - manhwa
          - webtoon
          - manhua
          - prose
      works:
        description: 'For custom: 1-30 titles, one per line; optional manga :: Title, web_novel :: Title, etc. No fixture cases.'
        required: false
        type: string
        default: ''
      batch:
        description: 'Preset suite only; select 1 for custom/core'
        required: true
        type: choice
        default: '1'
        options: ['1', '2', '3', '4', '5', '6', '7']
  push:
    branches: ['tsuzuki/mangaall-live-matrix-*', 'test/mangaall-live-full-journey-*', 'test/mangaall-akame-ao-real-identity-*']
    paths:
      - '.github/workflows/mangaall-live-matrix.yml'
      - 'tooling/mangaall_case_matrix.json'
      - 'tooling/mangaall_live_matrix.mjs'
      - 'tooling/mangaall_live_journey_core.mjs'
      - 'tooling/test_mangaall_live_journey.mjs'
      - 'tooling/mangaall_live_selection.json'
      - 'tooling/mangaall_generic_works.mjs'
      - 'tooling/test_mangaall_generic_works.mjs'
      - 'tooling/mangaall_real_envelope_capture.mjs'
      - 'tooling/test_mangaall_real_envelope_capture.mjs'

permissions:
  contents: read

concurrency:
  group: mangaall-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-provider-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard: ${{ fromJSON(inputs.suite == 'custom' && '[0,1,2]' || '[0]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confirm published signed package matches the real JS source under test
        shell: bash
        run: |
          set -euo pipefail
          node tooling/verify_index.mjs
          python3 tooling/build_provider.py providers/mangaall /tmp/mangaall-live-exact.tsz
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          payload = json.loads(Path('dist/index.payload.json').read_text())
          installed = [item for item in payload['providers'] if item['providerId'] == 'app.tsuzuki.mangaall']
          assert len(installed) == 1 and payload['repositoryId'] == 'app.tsuzuki.providers'
          entry = installed[0]
          assert entry['versionCode'] >= 8
          source_manifest = json.loads(Path('providers/mangaall/manifest.json').read_text())
          assert source_manifest['version']['code'] == entry['versionCode'], (
              'LIVE work runner refuses unsigned source candidate bytes'
          )
          package = Path('/tmp/mangaall-live-exact.tsz')
          digest = hashlib.sha256(package.read_bytes()).hexdigest()
          assert digest == entry['sha256'], 'Unpublished JS cannot claim signed-package parity'
          artifact = Path(f"dist/providers/app.tsuzuki.mangaall-{entry['versionCode']}.tsz")
          assert hashlib.sha256(artifact.read_bytes()).hexdigest() == digest
          print('MANGAALL_LIVE_PACKAGE_PARITY|sourceJS=SIGNED|providerCode=' + str(entry['versionCode']) + '|repositoryRoot=VERIFIED|sequence=' + str(payload['sequence']))
          PY
      - name: Offline generic input/shard contract (no source fixtures)
        run: node tooling/test_mangaall_generic_works.mjs
      - name: Offline negative/identity/origin contract
        run: node tooling/mangaall_live_matrix.mjs --self-test
      - name: Real MangaAll JS against actual upstreams (no canonical Host claim)
        env:
          MANGAALL_SUITE: ${{ inputs.suite || '' }}
          MANGAALL_BATCH: ${{ inputs.batch || '' }}
          MANGAALL_WORKS: ${{ inputs.works || '' }}
          MANGAALL_SHARD_INDEX: ${{ matrix.shard }}
          MANGAALL_SHARD_COUNT: ${{ inputs.suite == 'custom' && '3' || '1' }}
        run: |
          node tooling/mangaall_live_matrix.mjs --live \
            --output mangaall-live-matrix-${{ matrix.shard }}.json \
            --real-envelopes mangaall-real-envelopes-${{ matrix.shard }}.json
      - name: Upload sanitized public API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-live-source-journey-${{ matrix.shard }}
          path: mangaall-live-matrix-*.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload bounded normalized real source envelopes for Host parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mangaall-real-source-envelopes-${{ matrix.shard }}
          path: mangaall-real-envelopes-*.json
          if-no-files-found: warn
          retention-days: 3
