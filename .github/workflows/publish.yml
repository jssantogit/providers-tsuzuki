name: Publish repository

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - repository/publish.request

concurrency:
  group: providers-publish-main
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Conformance
        run: |
          node tooling/test_mangafire.mjs
          python3 tooling/check_repository.py
      - name: Verify existing signed repository snapshot
        run: node tooling/verify_index.mjs
      - name: Build Provider artifacts
        run: |
          # Keep immutable archives referenced by previous signed indexes.
          mkdir -p dist/providers
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          root = pathlib.Path('providers')
          for manifest_path in sorted(root.glob('*/manifest.json')):
              manifest = json.loads(manifest_path.read_text())
              if manifest.get('publication') == 'development':
                  continue
              output = pathlib.Path('dist/providers') / f"{manifest['id']}-{manifest['version']['code']}.tsz"
              subprocess.run(['python3', 'tooling/build_provider.py', str(manifest_path.parent), str(output)], check=True)
          PY
      - name: Plan atomic signed publication
        id: publication
        run: python3 tooling/prepare_publication.py
      - name: Build signed repository index
        if: steps.publication.outputs.changed == 'true'
        env:
          TSUZUKI_PROVIDER_SIGNING_KEY_PEM: ${{ secrets.TSUZUKI_PROVIDER_SIGNING_KEY_PEM }}
        run: |
          node tooling/build_index.mjs
          node tooling/sign_index.mjs
          node tooling/verify_index.mjs
      - name: Commit publication output
        if: steps.publication.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Sequence and new signed payload become visible in the same commit.
          git add repository/config.json dist
          if git diff --cached --quiet; then
            echo 'No publication changes.'
            exit 0
          fi
          sequence=$(node -e "console.log(JSON.parse(require('fs').readFileSync('repository/config.json')).sequence)")
          git commit -m "[publish] Provider repository sequence ${sequence}"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "git push failed after ${attempt} attempts" >&2
              exit 1
            fi
            sleep $((attempt * 3))
          done
