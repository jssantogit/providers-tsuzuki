name: MangaALL code10 — bounded MangaDot chapter pagination capability (metadata only)

# This is an explicit *test-branch commit* request, not production polling.
# Original signed code10 SHA remains unchanged. No CDN, page bytes, cookies,
# browser challenges, reader or canonical/edition binding are involved.
on:
  push:
    branches: ['test/mangaall-code10-mangadot-pagination-capability-*']
    paths:
      - '.github/workflows/mangaall-code10-mangadot-pagination-capability.yml'
      - 'tooling/mangaall_mangadot_pagination_capability.mjs'

permissions:
  contents: read

concurrency:
  group: mangaall-code10-mangadot-pagination-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-source-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify immutable signed code10 and test-only bounded five-GET script
        run: |
          set -euo pipefail
          node --check tooling/mangaall_mangadot_pagination_capability.mjs
          node tooling/verify_index.mjs
          python3 tooling/build_provider.py providers/mangaall "${RUNNER_TEMP}/verified-code10.tsz"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path(os.environ['RUNNER_TEMP'])/'verified-code10.tsz'
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          idx=json.loads(Path('dist/index.payload.json').read_text())
          matches=[x for x in idx['providers'] if x['providerId']=='app.tsuzuki.mangaall']
          assert idx['sequence']==36 and len(matches)==1 and matches[0]['versionCode']==10
          assert sha==matches[0]['sha256']=='bcdfd03ac18c3cfdd0517e08b58dde7efa1f5baa874e93002af28e518860f95f'
          assert hashlib.sha256(Path('dist/providers/app.tsuzuki.mangaall-10.tsz').read_bytes()).hexdigest()==sha
          print('CODE10_MANGADOT_PAGINATION_PREFLIGHT|P256=VERIFIED|source=UNCHANGED|network=NOT_YET_CALLED')
          PY
      - name: Five fixed GET chapter-list metadata probes; no body exported
        run: |
          set -euo pipefail
          node tooling/mangaall_mangadot_pagination_capability.mjs
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('mangaall-mangadot-pagination-capability.json').read_text())
          assert r['schema']==1
          assert r['scope']=='SOURCE_UNVERIFIED_METADATA_ONLY_NO_CANONICAL_OR_READER'
          assert len(r['requests'])==5
          assert [x['probe'] for x in r['requests']]==[
            'LIMIT50_PAGE1','LIMIT50_PAGE2','LIMIT50_OFFSET50','LIMIT50_PAGE1','LIMIT50_OFFSET50']
          allowed={'status','bodyKind','collection','count','firstRowKind','idKind','numberKind','hasErrorField','source','probe'}
          assert all(set(x)==allowed for x in r['requests'])
          report=Path('mangaall-mangadot-pagination-capability.json').read_text()
          assert 'https://' not in report and 'chapter_number' not in report
          print('CODE10_MANGADOT_PAGINATION_RESULT|network=BOUND_5_REQUESTS|content=NOT_EXPORTED|editorial=DENIED')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mangaall-code10-mangadot-pagination-${{ github.run_id }}
          path: mangaall-mangadot-pagination-capability.json
          if-no-files-found: warn
          retention-days: 7
