name: MangaFire live source preflight (branch-only)
on:
  push:
    branches:
      - fix/mangafire-ambiguous-lookup-budget-20261031
    paths:
      - .github/workflows/mangafire-live-source-preflight.yml
      - tooling/probe_mangafire_live.mjs
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public MangaFire metadata, with bounded network requests
        run: node tooling/probe_mangafire_live.mjs
