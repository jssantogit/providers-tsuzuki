name: Provider CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MangaFire contract fixtures
        run: node tooling/test_mangafire.mjs
      - name: MangaFire HTTP transport classification (offline, no candidate fixtures)
        run: node tooling/test_mangafire_access_probe.mjs
      - name: MangaAll source and chapter evidence fixtures
        run: node tooling/test_mangaall.mjs
      - name: MangaAll opt-in live probe boundary tests (offline fixtures)
        run: node tooling/test_mangaall_live_probe.mjs
      - name: MangaAll arbitrary title selection parser and shard contract (offline, no source replay)
        run: node tooling/test_mangaall_generic_works.mjs
      - name: MangaAll source-to-Host real envelope provenance contract
        run: node tooling/test_mangaall_real_envelope_capture.mjs
      - name: MangaAll existing live CLI source-verdict contract (offline only)
        run: node tooling/mangaall_live_matrix.mjs --self-test
      - name: MangaAll complete-source journey across 65 works (offline adversarial fixtures)
        run: node tooling/test_mangaall_live_journey.mjs
      - name: MangaAll experimental publication safety
        run: node tooling/test_mangaall_publication.mjs
      - name: MangaAll real signed code8 source-byte parity (no network)
        run: python3 tooling/test_mangaall_signed_source_parity.py
      - name: MangaAll code9 UNSIGNED staged package, V1 and V2 contract (offline only)
        run: python3 tooling/test_mangaall_code9_staging.py
      - name: MangaAll code9 neutral V2 wire UNSIGNED preview (offline; never published)
        run: python3 -m unittest discover -s tooling -p 'test_mangaall_code9_neutral_wire_preview.py' -v
      - name: MangaAll code9 reviewed source over signed code8 with 48KiB Host envelope (offline only)
        run: python3 -m unittest discover -s tooling -p 'test_mangaall_code9_review_source.py' -v
      - name: MangaAll code9 V2 opt-in live diagnostic safety (offline HTTP mocks only)
        run: node tooling/test_mangaall_code9_live_v2.mjs
      - name: MangaAll code9 isolated unsigned release-plan rehearsal (never signs/publishes)
        run: python3 -m unittest discover -s tooling -p 'test_mangaall_code9_release_rehearsal.py' -v
      - name: MangaAll code9 signed-release audit fails closed until real signature (offline)
        run: python3 -m unittest discover -s tooling -p 'test_mangaall_code9_signed_release_audit.py' -v
      - name: MangaAll code9 signed release authorization gate (offline, reject CI promotion)
        run: |
          python3 -m unittest discover -s tooling -p 'test_mangaall_code9_publication_gate.py' -v
          python3 - <<'PY'
          import pathlib
          import sys
          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tooling"))
          from mangaall_code9_publication_gate import check_code9_publication
          try:
              result = check_code9_publication(root, "push", "")
          except ValueError as error:
              if "manual dispatch" not in str(error):
                  raise
              print("MANGAALL_CODE9_RELEASE_GATE|outcome=DENIED_NON_MANUAL_CI")
          else:
              if result != "NO_CODE9_PROMOTION":
                  raise SystemExit("Unexpected code9 promotion without manual authorization: " + result)
              print("MANGAALL_CODE9_RELEASE_GATE|outcome=NO_CODE9_PROMOTION")
          PY
      - name: MangaAll UNSIGNED future partial-evidence lookup (single three-source router, offline)
        run: node tooling/test_mangaall_lookup_v2_candidate.mjs
      - name: MangaAll aggregator identity and reader-routing contract
        run: node tooling/test_mangaall_identity.mjs
      - name: MangaAll Reader page metadata and URL policy fixtures
        run: node tooling/test_mangaall_reading.mjs
      - name: MangaAll image origin permission and activation gate
        run: node tooling/test_mangaall_image_origin_contract.mjs
      - name: MangaAll single signed Provider contract
        run: node tooling/test_mangaall_single_provider.mjs
      - name: MangaAll cross-format arsenal, identity and novel-boundary matrix
        run: node tooling/test_mangaall_arsenal.mjs
      - name: MangaAll 0.5.3 actual-JS code8 offline Host contract replay
        run: node tooling/test_mangaall_code8_host_contract_replay.mjs
      - name: MangaDex verified author and facet coverage fixtures
        run: node tooling/test_mangaall_mangadex_evidence.mjs
      - name: MangaAll three-source contract
        run: node tooling/test_mangaall_three_sources.mjs
      - name: Nyaa torrent contract fixtures
        run: node tooling/test_nyaa.mjs
      - name: Nyaa item acceptance matrix
        run: node tooling/test_nyaa_item_acceptance.mjs
      - name: Nyaa runtime discovery budget fixture
        run: node tooling/test_nyaa_runtime_budget.mjs
      - name: Nyaa slow primary fallback fixture
        run: node tooling/test_nyaa_slow_primary_fallback.mjs
      - name: Nyaa bounded detail enrichment pagination fixture
        run: node tooling/test_nyaa_detail_enrichment_pagination.mjs
      - name: Direct P2P acquisition contract fixtures
        run: node tooling/test_direct_p2p.mjs
      - name: Host V1 signed-manifest compatibility regression
        run: python3 -m unittest discover -s tooling -p test_build_provider_manifest.py -v
      - name: Repository and package conformance
        run: python3 tooling/check_repository.py
      - name: One-link repository bootstrap and stable trust-root contract
        run: node tooling/test_repository_enrollment.mjs
      - name: Signed publication planner regression tests
        run: python3 -m unittest discover -s tooling -p 'test_prepare_publication.py' -v
      - name: Verify signed publication
        if: ${{ hashFiles('dist/index.json', 'repository/public-key.pem') != '' }}
        run: node tooling/verify_index.mjs

      - name: Signed publication dry-run (no signing or upload)
        run: |
          # Exercise the real packaging and promotion path on the PR while
          # keeping the public index at its currently verified sequence.
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess
          for manifest_path in sorted(pathlib.Path('providers').glob('*/manifest.json')):
              manifest = json.loads(manifest_path.read_text())
              if manifest.get('publication') == 'development':
                  continue
              output = pathlib.Path('dist/providers') / f"{manifest['id']}-{manifest['version']['code']}.tsz"
              subprocess.run(['python3', 'tooling/build_provider.py', str(manifest_path.parent), str(output)], check=True)
          PY
          python3 tooling/prepare_publication.py
          node tooling/build_index.mjs
          python3 - <<'PY'
          import json
          import pathlib
          config = json.loads(pathlib.Path('repository/config.json').read_text())
          payload = json.loads(pathlib.Path('dist/index.payload.json').read_text())
          assert payload['sequence'] == config['sequence']
          manifest = json.loads(pathlib.Path('providers/mangafire/manifest.json').read_text())
          manga = next(p for p in payload['providers'] if p['providerId'] == 'app.tsuzuki.mangafire')
          assert manga['versionCode'] == manifest['version']['code']
          print('signed publication dry-run: expected sequence', config['sequence'], 'MangaFire code', manga['versionCode'])
          PY
