name: Provider CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: MangaFire contract fixtures
        run: node tooling/test_mangafire.mjs
      - name: MangaAll source and chapter evidence fixtures
        run: node tooling/test_mangaall.mjs
      - name: MangaAll opt-in live probe boundary tests (offline fixtures)
        run: node tooling/test_mangaall_live_probe.mjs
      - name: MangaAll experimental publication safety
        run: node tooling/test_mangaall_publication.mjs
      - name: MangaAll aggregator identity and reader-routing contract
        run: node tooling/test_mangaall_identity.mjs
      - name: MangaAll Reader page metadata and URL policy fixtures
        run: node tooling/test_mangaall_reading.mjs
      - name: MangaAll image origin permission and activation gate
        run: node tooling/test_mangaall_image_origin_contract.mjs
      - name: MangaAll three-source contract
        run: node tooling/test_mangaall_three_sources.mjs
      - name: Nyaa torrent contract fixtures
        run: node tooling/test_nyaa.mjs
      - name: Nyaa item acceptance matrix
        run: node tooling/test_nyaa_item_acceptance.mjs
      - name: Nyaa runtime discovery budget fixture
        run: node tooling/test_nyaa_runtime_budget.mjs
      - name: Nyaa slow primary fallback fixture
        run: node tooling/test_nyaa_slow_primary_fallback.mjs
      - name: Nyaa bounded detail enrichment pagination fixture
        run: node tooling/test_nyaa_detail_enrichment_pagination.mjs
      - name: Direct P2P acquisition contract fixtures
        run: node tooling/test_direct_p2p.mjs
      - name: Host V1 signed-manifest compatibility regression
        run: python3 -m unittest discover -s tooling -p test_build_provider_manifest.py -v
      - name: Repository and package conformance
        run: python3 tooling/check_repository.py
      - name: Signed publication planner regression tests
        run: python3 -m unittest discover -s tooling -p 'test_prepare_publication.py' -v
      - name: Verify signed publication
        if: ${{ hashFiles('dist/index.json', 'repository/public-key.pem') != '' }}
        run: node tooling/verify_index.mjs
